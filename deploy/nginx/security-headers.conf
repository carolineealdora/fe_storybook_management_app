# Included in every location: nginx drops server-level add_header once a location sets its own.
# The main Content-Security-Policy is a <meta> tag in index.html (vite.config.ts); these need real headers.
# Add Strict-Transport-Security at the TLS terminator.
add_header Content-Security-Policy "frame-ancestors 'none'" always;
add_header X-Frame-Options "DENY" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "no-referrer" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
